name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Re-run a release build on demand (e.g. after a failed publish).
  workflow_dispatch:

# GITHUB_TOKEN is read-only by default on public repos (2025 on); the
# release job needs to create the release and upload assets.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Same dependency set the README documents for Debian/Ubuntu: the
      # Fyne GUI is cgo and needs the C toolchain + GL/X11 headers.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: vet
        run: make vet
      - name: test (-race)
        run: make test
      - name: build
        run: make build

  release:
    needs: test
    # Tag pushes build+publish; workflow_dispatch with ref=vX.Y.Z re-runs
    # a publish (e.g. after a failed upload) without touching the tag.
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tag history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Build release binary
        run: make release BINARY=sway-power_linux_amd64
      - name: Checksum
        run: sha256sum sway-power_linux_amd64 > SHA256SUMS.txt
      # gh CLI (preinstalled on runners) instead of a JS action: it
      # creates the release if missing, streams the assets natively, and
      # is immune to the node20/node24 action-runtime churn.
      # GITHUB_TOKEN (already set by Actions) has contents:write from
      # the top-level permissions block.
      - name: Publish to GitHub Release
        run: gh release upload "${GITHUB_REF_NAME}" sway-power_linux_amd64 SHA256SUMS.txt --clobber
